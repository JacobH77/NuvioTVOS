name: Build custom Apple TV IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - NuvioTVOS-preferences.patch
      - tvosApp/NuvioTV/Sources/**
      - .github/workflows/build-custom-ipa.yml
  push:
    branches: [main, fresh-bobsupra-feature-port]
    paths:
      - NuvioTVOS-preferences.patch
      - tvosApp/NuvioTV/Sources/**
      - .github/workflows/build-custom-ipa.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply requested app changes
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "Building the app sources from this pull request checkout"
          elif [[ ! -f NuvioTVOS-preferences.patch ]]; then
            echo "No preferences patch is present; building the checked-out sources"
          elif git apply --reverse --check NuvioTVOS-preferences.patch 2>/dev/null; then
            echo "Preference changes are already applied"
          else
            git apply --check NuvioTVOS-preferences.patch
            git apply NuvioTVOS-preferences.patch
          fi
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install pinned Tuist
        run: |
          brew install mise
          mise install
      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-custom-IPA
          path: build-ipa/NuvioTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
